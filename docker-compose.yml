services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analise-extrato-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      # Caso o banco esteja no host da máquina, use host.docker.internal no .env
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-sistemas}
      - DB_USERNAME=${DB_USERNAME:-local}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SCHEMA=${DB_SCHEMA:-financeiro}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./relatorios:/app/relatorios
